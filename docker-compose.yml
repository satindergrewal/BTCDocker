services:
  tor:
    build: ./tor
    container_name: btc-tor
    restart: unless-stopped
    volumes:
      - tor-data:/var/lib/tor
    networks:
      btcnet:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9050 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  bitcoin:
    build: ./bitcoin
    container_name: btc-node
    restart: unless-stopped
    depends_on:
      tor:
        condition: service_healthy
    volumes:
      - ${BTC_DATA_DIR:-./data/btc}:/data/.bitcoin
      - ./bitcoin.conf:/etc/bitcoin/bitcoin.conf:ro
    command: ["-datadir=/data/.bitcoin", "-conf=/etc/bitcoin/bitcoin.conf"]
    networks:
      - btcnet

  fulcrum:
    image: cculianu/fulcrum:latest
    container_name: btc-fulcrum
    restart: unless-stopped
    depends_on:
      - bitcoin
    volumes:
      - ${FULCRUM_DATA_DIR:-./data/fulcrum}:/data
      - ./fulcrum.conf:/etc/fulcrum/fulcrum.conf:ro
    ports:
      # Electrum TCP port exposed to host so wallets can connect
      - "127.0.0.1:50001:50001"
      # Admin RPC — localhost only
      - "127.0.0.1:8000:8000"
      # Stats HTTP page — localhost only
      - "127.0.0.1:8080:8080"
    networks:
      - btcnet
    entrypoint: ["Fulcrum"]
    command: ["/etc/fulcrum/fulcrum.conf"]

volumes:
  tor-data:

networks:
  btcnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
