services:
  tor:
    build: ./tor
    container_name: btc-tor
    restart: unless-stopped
    volumes:
      - tor-data:/var/lib/tor
    networks:
      btcnet:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9050 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  bitcoin:
    build: ./bitcoin
    container_name: btc-node
    restart: unless-stopped
    depends_on:
      tor:
        condition: service_healthy
    volumes:
      - ${BTC_DATA_DIR:-./data/btc}:/data/.bitcoin
      - ./bitcoin.conf:/etc/bitcoin/bitcoin.conf:ro
    command: ["-datadir=/data/.bitcoin", "-conf=/etc/bitcoin/bitcoin.conf"]
    networks:
      - btcnet

  fulcrum:
    image: cculianu/fulcrum:latest
    container_name: btc-fulcrum
    restart: unless-stopped
    depends_on:
      - bitcoin
    volumes:
      - ${FULCRUM_DATA_DIR:-./data/fulcrum}:/data
      - ./fulcrum.conf:/etc/fulcrum/fulcrum.conf:ro
    ports:
      # Electrum TCP port exposed to host so wallets can connect
      - "127.0.0.1:50001:50001"
      # Admin RPC — localhost only
      - "127.0.0.1:8000:8000"
      # Stats HTTP page — localhost only
      - "127.0.0.1:8080:8080"
    networks:
      - btcnet
    entrypoint: ["Fulcrum"]
    command: ["/etc/fulcrum/fulcrum.conf"]

  # === Mempool Block Explorer ===
  mempool-db:
    image: mariadb:lts
    container_name: btc-mempool-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mempool
      MYSQL_USER: mempool
      MYSQL_PASSWORD: mempool
      MYSQL_ROOT_PASSWORD: mempool
    volumes:
      - mempool-db-data:/var/lib/mysql
    networks:
      - btcnet

  mempool-backend:
    image: mempool/backend:latest
    container_name: btc-mempool-backend
    restart: unless-stopped
    depends_on:
      - bitcoin
      - mempool-db
    environment:
      MEMPOOL_BACKEND: "electrum"
      ELECTRUM_HOST: "btc-fulcrum"
      ELECTRUM_PORT: "50001"
      ELECTRUM_TLS_ENABLED: "false"
      CORE_RPC_HOST: "btc-node"
      CORE_RPC_PORT: "8332"
      CORE_RPC_USERNAME: "btcrpc"
      CORE_RPC_PASSWORD: "${MEMPOOL_RPC_PASSWORD}"
      DATABASE_ENABLED: "true"
      DATABASE_HOST: "btc-mempool-db"
      DATABASE_DATABASE: "mempool"
      DATABASE_USERNAME: "mempool"
      DATABASE_PASSWORD: "mempool"
      STATISTICS_ENABLED: "true"
    networks:
      - btcnet

  mempool-frontend:
    image: mempool/frontend:latest
    container_name: btc-mempool-frontend
    restart: unless-stopped
    depends_on:
      - mempool-backend
    environment:
      FRONTEND_HTTP_PORT: "8181"
      BACKEND_MAINNET_HTTP_HOST: "btc-mempool-backend"
    ports:
      - "127.0.0.1:8181:8181"
    networks:
      - btcnet

volumes:
  tor-data:
  mempool-db-data:

networks:
  btcnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
